<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="ik-abd" cx="42%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="55%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ik-ceph" cx="40%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ik-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a3a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ik-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- LEGS — drawn behind body. Each leg has two visible joints (kink in path). -->
  <g fill="none" stroke="url(#ik-leg)" stroke-width="3.4" stroke-linecap="round">
    <!-- LEFT SIDE -->
    <!-- L1: front-forward -->
    <path d="M 108 96 Q 74 72 50 56 Q 38 50 28 38"/>
    <!-- L2: out-forward -->
    <path d="M 102 108 Q 68 100 42 92 Q 30 90 18 80"/>
    <!-- L3: out-back -->
    <path d="M 104 124 Q 68 130 40 132 Q 26 134 12 130"/>
    <!-- L4: rear-back -->
    <path d="M 112 134 Q 82 158 60 182 Q 46 198 30 210"/>

    <!-- RIGHT SIDE (mirror) -->
    <path d="M 132 96 Q 166 72 190 56 Q 202 50 212 38"/>
    <path d="M 138 108 Q 172 100 198 92 Q 210 90 222 80"/>
    <path d="M 136 124 Q 172 130 200 132 Q 214 134 228 130"/>
    <path d="M 128 134 Q 158 158 180 182 Q 194 198 210 210"/>
  </g>

  <!-- Leg shadow accents — thin inner line for matte definition -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-linecap="round" opacity="0.85">
    <path d="M 108 96 Q 74 72 50 56 Q 38 50 28 38"/>
    <path d="M 102 108 Q 68 100 42 92 Q 30 90 18 80"/>
    <path d="M 104 124 Q 68 130 40 132 Q 26 134 12 130"/>
    <path d="M 112 134 Q 82 158 60 182 Q 46 198 30 210"/>
    <path d="M 132 96 Q 166 72 190 56 Q 202 50 212 38"/>
    <path d="M 138 108 Q 172 100 198 92 Q 210 90 222 80"/>
    <path d="M 136 124 Q 172 130 200 132 Q 214 134 228 130"/>
    <path d="M 128 134 Q 158 158 180 182 Q 194 198 210 210"/>
  </g>

  <!-- Leg joint pads — tiny knuckles where the leg bends -->
  <g fill="#000000">
    <circle cx="50" cy="56" r="2.6"/><circle cx="28" cy="38" r="2.2"/>
    <circle cx="42" cy="92" r="2.6"/><circle cx="18" cy="80" r="2.2"/>
    <circle cx="40" cy="132" r="2.6"/><circle cx="12" cy="130" r="2.2"/>
    <circle cx="60" cy="182" r="2.6"/><circle cx="30" cy="210" r="2.2"/>
    <circle cx="190" cy="56" r="2.6"/><circle cx="212" cy="38" r="2.2"/>
    <circle cx="198" cy="92" r="2.6"/><circle cx="222" cy="80" r="2.2"/>
    <circle cx="200" cy="132" r="2.6"/><circle cx="228" cy="130" r="2.2"/>
    <circle cx="180" cy="182" r="2.6"/><circle cx="210" cy="210" r="2.2"/>
  </g>

  <!-- ABDOMEN (rear/larger) -->
  <ellipse cx="120" cy="148" rx="38" ry="32" fill="url(#ik-abd)"/>
  <!-- Abdomen sheen highlight -->
  <ellipse cx="108" cy="134" rx="14" ry="9" fill="url(#ik-sheen)"/>
  <!-- Abdomen subtle texture rim -->
  <ellipse cx="120" cy="148" rx="38" ry="32" fill="none" stroke="#000000" stroke-width="0.6" opacity="0.5"/>

  <!-- PEDICEL — narrow waist between abdomen and cephalothorax -->
  <ellipse cx="120" cy="118" rx="6" ry="4" fill="#000000"/>

  <!-- CEPHALOTHORAX (front, smaller) -->
  <ellipse cx="120" cy="106" rx="26" ry="22" fill="url(#ik-ceph)"/>
  <!-- Cephalothorax sheen -->
  <ellipse cx="112" cy="98" rx="8" ry="5" fill="url(#ik-sheen)"/>

  <!-- 8 EYES — arranged in 2 rows of 4, matte dark, no glow -->
  <g fill="#0f0f0f">
    <circle cx="110" cy="94" r="1.6"/>
    <circle cx="116" cy="92" r="1.8"/>
    <circle cx="124" cy="92" r="1.8"/>
    <circle cx="130" cy="94" r="1.6"/>
    <circle cx="114" cy="98" r="1.3"/>
    <circle cx="120" cy="98" r="1.4"/>
    <circle cx="126" cy="98" r="1.3"/>
  </g>

  <!-- Chelicerae (mouthparts) — tiny dark pair at front -->
  <g fill="#050505">
    <ellipse cx="116" cy="118" rx="2.6" ry="3.4"/>
    <ellipse cx="124" cy="118" rx="2.6" ry="3.4"/>
  </g>
</svg>
